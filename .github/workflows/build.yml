name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Gradle for Linux runner
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SakuraNightDrift.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraNightDrift-APK
          path: SakuraNightDrift.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sakura Night Drift 3D (Latest)"
          files: SakuraNightDrift.apk

      - name: Send APK to Telegram (optional)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -sS -F document=@SakuraNightDrift.apk \
                 -F caption="Sakura Night Drift 3D — свежая сборка APK" \
                 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument?chat_id=${TG_CHAT_ID}"
          else
            echo "Telegram secrets not set, skipping."
          fi
