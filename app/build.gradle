plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sakura.drift'
    compileSdk 34

    defaultConfig {
        applicationId "com.sakura.drift"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // Без тяжёлых сторонних зависимостей — чистый Android SDK и системный WebView с WebGL
}
